<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitfahrten Stuttgart</title>
<style>
  :root {
    --primary: #F08300;
    --orange-dark: #C13E17;
    --cream: #FBE9D3;
    --white: #FFFFFF;
    --ink: #111111;
    --muted: #4A4A4A;
    --gutter: max(20px, calc((100% - 1200px) / 2));
    --gutter-sm: max(16px, calc((100% - 1200px) / 2));
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); font-family: Arial, Helvetica, sans-serif; color: var(--ink); }
  button { font: inherit; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .page { min-height: 100vh; display: flex; flex-direction: column; }

  .site-header { background: var(--white); padding: 16px var(--gutter); }
  .site-header svg { height: 28px; width: auto; display: block; }

  .hero { background: var(--white); padding: 8px var(--gutter) 0; }
  .hero h1 { margin: 0; font-size: clamp(22px, 3.2vw + 10px, 44px); line-height: 1.15; font-weight: 700; text-transform: uppercase; }
  .hero h1 span { white-space: nowrap; }

  .filters { position: sticky; top: 0; z-index: 10; }
  .dir-wrap { background: var(--white); padding-top: 8px; }
  .dir-tabs { display: flex; flex-wrap: nowrap; align-items: flex-end; gap: 2px; padding: 0 var(--gutter); border-bottom: 4px solid var(--primary); }
  .dir-tabs button { flex: 0 0 auto; min-height: 48px; padding: 0 26px 0 14px; border: none; border-radius: 0 30px 0 0; background: transparent; color: var(--ink); font-size: 15px; font-weight: 700; white-space: nowrap; cursor: pointer; }
  .dir-tabs button[aria-pressed="true"] { background: var(--primary); color: var(--ink); }

  .day-wrap { background: var(--cream); padding: 12px 0; }
  .day-strip { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding: 0 var(--gutter-sm); scrollbar-width: none; }
  .day-strip::-webkit-scrollbar { display: none; }
  .day-strip button { flex: 0 0 auto; width: 80px; height: 60px; padding: 0; border: none; border-radius: 0 18px 0 0; background: var(--white); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
  .day-strip button[aria-pressed="true"] { background: var(--primary); color: var(--ink); }
  .day-strip .top { font-size: 15px; font-weight: 700; line-height: 1; }
  .day-strip .bottom { font-size: 13px; font-weight: 400; line-height: 1; }

  main { padding: 4px var(--gutter-sm) 32px; flex: 1 1 auto; }
  .list { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 760px; }
  .empty { background: var(--white); padding: 24px 16px; text-align: center; font-size: 16px; line-height: 1.5; }

  .ride { background: var(--white); padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .train { display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 1; }
  .train strong { font-weight: 700; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ride-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 26px; }
  .ride-day { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
  .ride-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 33px; }
  .badge { font-size: 14px; font-weight: 700; padding: 8px 12px; white-space: nowrap; background: var(--cream); color: var(--ink); }
  .times { display: flex; align-items: center; gap: 12px; min-height: 40px; }
  .dep { font-size: clamp(36px, 1vw + 32px, 40px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .arr { font-size: clamp(22px, 0.5vw + 20px, 24px); line-height: 1; font-variant-numeric: tabular-nums; }
  .route { display: flex; gap: 12px; }
  .route-line { display: flex; flex-direction: column; align-items: center; padding: 5px 0; }
  .route-line .from { width: 10px; height: 10px; border: 2px solid var(--ink); background: var(--white); flex: 0 0 auto; }
  .route-line .bar { width: 2px; flex: 1 1 auto; background: var(--ink); }
  .route-line .to { width: 10px; height: 10px; background: var(--ink); flex: 0 0 auto; }
  .stops { display: flex; flex-direction: column; gap: 22px; min-width: 0; flex: 1 1 auto; }
  .stop { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .stop-name { font-size: 16px; font-weight: 700; line-height: 20px; }
  .stop-track { font-size: 14px; white-space: nowrap; }
  .stop-track strong { font-weight: 700; }
  .contact { display: flex; align-items: center; gap: 12px; background: var(--cream); padding: 12px; }
  .contact-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 auto; padding-left: 2px; font-size: 14px; line-height: 1.3; }
  .contact-text strong { font-weight: 600; }
  .contact-text .phone { font-size: 18px; font-weight: 600; line-height: 1.2; letter-spacing: 0.01em; white-space: nowrap; }
  .call { flex: 0 0 auto; height: 48px; padding: 0 18px 0 14px; background: var(--orange-dark); color: var(--white); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 400; text-decoration: none; }

  .hint { margin: 0 0 16px; max-width: 760px; display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.4; }
  .hint svg { flex: 0 0 auto; margin-top: 1px; }
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 628 154" role="img" aria-label="Arverio Deutschland">
      <path fill="#000" d="M332.05,77.99h50.79v14.01h-67.5V2h65.7v14.02h-48.98v23.4h44.61c0,7.6-6.16,13.75-13.75,13.75h-30.86v24.82ZM207.66,34.01c0-19.93-14.66-32.01-38.32-32.01h-37.02v90h16.72V16.15h19.53c14.66,0,22.25,6.56,22.25,17.87s-7.59,18-22.25,18c-6.96,0-12.6,5.64-12.6,12.6v1.15h13.41c2.2,0,4.27,1.07,5.53,2.88l16.29,23.36h18l-20.7-29.58c12.22-4.75,19.17-14.78,19.17-28.41ZM258.84,71.43L228.88,2h-18.13l39.34,90h16.45L305.76,2h-16.72l-30.21,69.43ZM627.18,46.97c0,26.75-20.59,46.31-48.51,46.31s-48.51-19.68-48.51-46.31S550.75.65,578.67.65s48.51,19.56,48.51,46.33ZM610.32,46.97c0-18.41-13.5-31.66-31.65-31.66s-31.65,13.25-31.65,31.66,13.5,31.65,31.65,31.65,31.65-13.25,31.65-31.65ZM476.88,34.01c0-19.93-14.66-32.01-38.31-32.01h-37.03v90h16.71V16.15h19.55c14.66,0,22.23,6.56,22.23,17.87s-7.58,18-22.23,18c-6.97,0-12.62,5.65-12.62,12.62v1.13h13.43c2.2,0,4.25,1.07,5.51,2.87l16.31,23.37h18l-20.7-29.58c12.21-4.75,19.15-14.78,19.15-28.41ZM495.56,92h16.72V2h-16.72v90ZM0,92h16.72c0-41.09,33.5-74.52,75.12-74.52h5.18v74.52h16.72V2h-21.9C41.87,2,0,42.37,0,92Z"/>
      <path fill="#f08300" d="M32.15,59.46c16.69-14.79,49.23,32.38,59.28-9.76-19.64,17.16-42.32-20.9-59.28,9.76"/>
      <path fill="#000" d="M10.41,122H0v30h10.41c9.43,0,15.94-6.56,15.94-15v-.09c0-8.44-6.51-14.91-15.94-14.91ZM22.84,137.09c0,6.64-4.84,11.79-12.43,11.79H3.39v-23.74h7.03c7.59,0,12.43,5.23,12.43,11.87v.09ZM36.9,148.91h18.51v3.09h-21.9v-30h21.69v3.09h-18.3v10.24h16.37v3.09h-16.37v10.5ZM83.35,122h3.39v17.19c0,8.74-5.01,13.29-12.51,13.29s-12.47-4.54-12.47-13.03v-17.44h3.39v17.23c0,6.47,3.43,10.11,9.17,10.11s9.04-3.34,9.04-9.9v-17.44ZM92.44,122h23.61v3.13h-10.11v26.87h-3.39v-26.87h-10.11v-3.13ZM142.28,143.86v.09c0,5.14-4.29,8.49-10.24,8.49-4.76,0-8.66-1.59-12.26-4.8l2.1-2.49c3.13,2.83,6.13,4.24,10.29,4.24s6.69-2.14,6.69-5.1v-.09c0-2.79-1.5-4.37-7.8-5.7-6.9-1.5-10.07-3.73-10.07-8.66v-.09c0-4.71,4.16-8.19,9.86-8.19,4.37,0,7.5,1.24,10.54,3.69l-1.97,2.61c-2.79-2.27-5.57-3.26-8.66-3.26-3.9,0-6.39,2.14-6.39,4.84v.09c0,2.83,1.54,4.41,8.14,5.83,6.69,1.46,9.77,3.9,9.77,8.49ZM172.66,145.06l2.23,2.19c-3.13,3.17-6.56,5.27-12,5.27-8.66,0-15.04-6.81-15.04-15.43v-.09c0-8.49,6.34-15.51,15.17-15.51,5.44,0,8.7,1.93,11.7,4.76l-2.31,2.49c-2.53-2.4-5.36-4.11-9.43-4.11-6.64,0-11.61,5.4-11.61,12.3v.09c0,6.94,5.01,12.39,11.61,12.39,4.11,0,6.81-1.59,9.69-4.33ZM201.67,122h3.39v30h-3.39v-13.5h-17.31v13.5h-3.39v-30h3.39v13.33h17.31v-13.33ZM216.93,148.87h16.89v3.13h-20.27v-30h3.39v26.87ZM251,121.79l-13.67,30.21h3.47l3.56-7.93h16.33l3.51,7.93h3.64l-13.67-30.21h-3.17ZM245.68,141.03l6.86-15.3,6.81,15.3h-13.67ZM295.83,122h3.3v30h-2.7l-19.37-24.6v24.6h-3.3v-30h3.17l18.9,24.04v-24.04ZM318.02,122h-10.41v30h10.41c9.43,0,15.94-6.56,15.94-15v-.09c0-8.44-6.51-14.91-15.94-14.91ZM330.45,137.09c0,6.64-4.84,11.79-12.43,11.79h-7.03v-23.74h7.03c7.59,0,12.43,5.23,12.43,11.87v.09Z"/>
    </svg>
  </header>

  <section class="hero">
    <h1><span>Mitfahrten</span> <span>Stuttgart</span></h1>
  </section>

  <div class="filters">
    <div class="dir-wrap">
      <nav class="dir-tabs" id="dirTabs" aria-label="Richtung filtern"></nav>
    </div>
    <div class="day-wrap">
      <nav class="day-strip" id="dayStrip" aria-label="Tag filtern"></nav>
    </div>
  </div>

  <main>
    <p class="hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C13E17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg><span><strong>Mitfahrt telefonisch abstimmen.</strong> Zeiten und Gleise können sich kurzfristig ändern.</span></p>
    <div class="list" id="list"></div>
  </main>

</div>

<script>
(function () {
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const wdNames = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Beispieldaten (Mock-up): je Tag 30 Rangierfahrten, heute + 3 Folgetage, abwechselnd beide Richtungen
  function buildDemoRides() {
    let seed = 19096;
    const rnd = (n) => { seed = (seed * 9301 + 49297) % 233280; return Math.floor(seed / 233280 * n); };
    const hm = (m) => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
    const base = new Date(); base.setHours(0, 0, 0, 0);
    const rides = [];
    for (let day = 0; day < 4; day++) {
      const d = new Date(base); d.setDate(base.getDate() + day);
      for (let j = 0; j < 30; j++) {
        const dir = j % 2 === 0 ? 'hbf' : 'abst';
        const dep = 240 + j * 39 + rnd(30);
        const dur = 12 + rnd(7);
        const abst = String(650 + rnd(9));
        const hbf = String(1 + rnd(16));
        rides.push({
          name: 'Max Mustermann', phone: '0170 123 4567', date: iso(d),
          dep: hm(dep), arr: hm(dep + dur), dir: dir,
          fromTrack: dir === 'hbf' ? abst : hbf,
          toTrack: dir === 'hbf' ? hbf : abst,
          train: String(19000 + rnd(200))
        });
      }
    }
    return rides;
  }

  const state = { filter: 'hbf', day: iso(new Date()), rides: buildDemoRides() };

  function dayLabel(isoDate) {
    const d = new Date(isoDate + 'T00:00:00');
    return wdNames[d.getDay()] + '. ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.';
  }

  function badge(r) {
    const dep = new Date(r.date + 'T' + r.dep + ':00');
    const arr = new Date(r.date + 'T' + (r.arr || r.dep) + ':00');
    const now = new Date();
    const min = Math.round((dep - now) / 60000);
    if (now > arr) return null;
    if (min <= 0) return { text: 'fährt gerade', lv: 'now' };
    if (min <= 5) return { text: 'in ca. ' + min + ' Min.', lv: 'now' };
    if (min <= 15) return { text: 'in ca. ' + min + ' Min.', lv: 'soon' };
    if (min <= 60) return { text: 'in ca. ' + min + ' Min.', lv: 'near' };
    if (min <= 120) return { text: 'in ca. ' + min + ' Min.', lv: 'later' };
    if (r.date === iso(now)) return { text: 'heute', lv: 'later' };
    return null;
  }

  function renderDirTabs() {
    const defs = [{ id: 'hbf', label: 'Zum Hbf' }, { id: 'abst', label: 'Zur Abstellung' }];
    const el = document.getElementById('dirTabs');
    el.innerHTML = defs.map((f) =>
      '<button type="button" data-id="' + f.id + '" aria-pressed="' + (state.filter === f.id) + '">' + f.label + '</button>'
    ).join('');
    el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { state.filter = b.dataset.id; render(); }));
  }

  function renderDays() {
    const base = new Date(); base.setHours(0, 0, 0, 0);
    const defs = [];
    for (let i = 0; i < 4; i++) {
      const d = new Date(base); d.setDate(base.getDate() + i);
      const dm = pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.';
      defs.push({ id: iso(d), top: i === 0 ? 'Heute' : (i === 1 ? 'Morgen' : wdNames[d.getDay()]), bottom: dm, aria: wdNames[d.getDay()] + ' ' + dm });
    }
    const el = document.getElementById('dayStrip');
    el.innerHTML = defs.map((d) =>
      '<button type="button" data-id="' + d.id + '" aria-pressed="' + (state.day === d.id) + '" aria-label="' + d.aria + '">' +
      '<span class="top">' + d.top + '</span><span class="bottom">' + d.bottom + '</span></button>'
    ).join('');
    el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { state.day = b.dataset.id; render(); }));
  }

  const arrowSvg = '<svg width="28" height="16" viewBox="0 0 28 16" fill="none" stroke="#C13E17" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M2 8h23"/><path d="M19 2l6 6l-6 6"/></svg>';
  const trainSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C13E17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14"/><path d="M9 21l-2 -4"/><path d="M15 21l2 -4"/></svg>';
  const phoneSvg = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/></svg>';

  function renderList() {
    const now = new Date();
    const list = state.rides
      .slice()
      .sort((a, b) => (a.date + a.dep).localeCompare(b.date + b.dep))
      .filter((r) => r.dir === state.filter)
      .filter((r) => r.date === state.day)
      .filter((r) => new Date(r.date + 'T' + (r.arr || r.dep) + ':00') >= now);

    const el = document.getElementById('list');
    if (!list.length) {
      el.innerHTML = '<div class="empty">Für diese Auswahl ist keine Mitfahrt eingetragen.</div>';
      return;
    }
    el.innerHTML = list.map((r) => {
      const toHbf = r.dir === 'hbf';
      const b = badge(r);
      const tel = 'tel:' + String(r.phone || '').replace(/[^0-9+]/g, '');
      return '<article class="ride">' +
        '<div class="ride-top"><span class="train">' + trainSvg + '<span class="sr">Zug </span><strong>' + esc(r.train) + '</strong></span>' +
          (b ? '<span class="badge">' + esc(b.text) + '</span>' : '') + '</div>' +
        '<div class="times"><span class="dep">' + r.dep + '</span>' + arrowSvg +
          '<span class="arr">' + (r.arr || '–') + '</span></div>' +
        '<div class="route"><div class="route-line" aria-hidden="true"><span class="from"></span><span class="bar"></span><span class="to"></span></div>' +
          '<div class="stops">' +
            '<div class="stop"><span class="stop-name">' + (toHbf ? 'Stuttgart Abstellung' : 'Stuttgart Hbf') + '</span><span class="stop-track">Gleis <strong>' + esc(r.fromTrack || '–') + '</strong></span></div>' +
            '<div class="stop"><span class="stop-name">' + (toHbf ? 'Stuttgart Hbf' : 'Stuttgart Abstellung') + '</span><span class="stop-track">Gleis <strong>' + esc(r.toTrack || '–') + '</strong></span></div>' +
          '</div></div>' +
        '<div class="contact"><div class="contact-text">' +
          '<span><strong>' + esc(r.name) + '</strong></span>' +
          '<span class="phone">' + esc(r.phone) + '</span></div>' +
          '<a class="call" href="' + esc(tel) + '" aria-label="' + esc(r.name) + ' anrufen">' + phoneSvg + '<span>Anrufen</span></a></div>' +
      '</article>';
    }).join('');
  }

  function render() { renderDirTabs(); renderDays(); renderList(); }

  render();
  setInterval(renderList, 30000);
})();
</script>
</body>
</html>
